name: Deploy FastAPI (auto, diff-aware)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'scripts/fastapi/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: env

    steps:
      # 1️⃣ Checkout with enough history for diff
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # 2️⃣ Detect environment (main = prod, dev = dev)
      - name: Detect environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "port=6969" >> $GITHUB_OUTPUT
            echo "deploy_dir=yeetcode-api" >> $GITHUB_OUTPUT
            echo "log_file=fastapi.log" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "port=42069" >> $GITHUB_OUTPUT
            echo "deploy_dir=yeetcode-api-dev" >> $GITHUB_OUTPUT
            echo "log_file=fastapi-dev.log" >> $GITHUB_OUTPUT
          fi

      # 3️⃣ Figure out what changed
      - name: Detect FastAPI changes
        id: diff
        run: |
          git diff --name-only HEAD~1 HEAD -- scripts/fastapi/ > changed.txt
          CHANGED=$(grep -v '^$' changed.txt | tr '\n' ',' | sed 's/,$//')
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT

      # 3️⃣ Skip entirely if nothing changed
      - name: Skip if no changes
        if: steps.diff.outputs.changed_files == ''
        run: |
          echo "✅ No FastAPI files changed; skipping deploy."

      # 4️⃣ Archive only the changed files (flatten paths)
      - name: Archive changed files
        if: steps.diff.outputs.changed_files != ''
        run: |
          mkdir -p changed-files
          while read file; do
            rel="${file#scripts/fastapi/}"
            mkdir -p "changed-files/$(dirname "$rel")"
            cp "$file" "changed-files/$rel"
          done < changed.txt
          tar -czf changed-files.tgz -C changed-files .

      # 5️⃣ Install SSH key and suppress banners
      - name: Setup SSH key & silence banner
        if: steps.diff.outputs.changed_files != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # add known host and disable MOTD on VPS
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "touch ~/.hushlogin"

      # 6️⃣ Copy & deploy on the VPS
      - name: Deploy to VPS
        if: steps.diff.outputs.changed_files != ''
        run: |
          # copy archive and list
          scp -i ~/.ssh/id_ed25519 -q -o StrictHostKeyChecking=no \
            changed-files.tgz changed.txt \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/ 

          # SSH in quietly and run all deploy steps
          ssh -i ~/.ssh/id_ed25519 -q -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            # Detect environment from branch
            ENV="${{ steps.env.outputs.environment }}"
            DEPLOY_DIR="${{ steps.env.outputs.deploy_dir }}"
            LOG_FILE="${{ steps.env.outputs.log_file }}"
            PORT="${{ steps.env.outputs.port }}"

            # Navigate to correct deployment directory
            cd ~/$DEPLOY_DIR

            # unpack files
            tar -xzf ~/changed-files.tgz -C .
            rm ~/changed-files.tgz

            # reinstall if needed
            if grep -q '^requirements.txt$' ~/changed.txt; then
              echo "📦 requirements.txt changed; reinstalling..."
              source .venv/bin/activate
              pip install -r requirements.txt
            fi

            # restart the app (kill by port to avoid cross-killing)
            PID=$(lsof -ti:$PORT) || true
            if [ -n "$PID" ]; then
              echo "Killing process on port $PORT: $PID"
              kill $PID
              sleep 2
            fi

            source .venv/bin/activate
            nohup python3 main.py --env $ENV > $LOG_FILE 2>&1 &

            # Health check loop (30s timeout, 6 attempts with 5s sleep)
            echo "🔍 Running health check on http://localhost:$PORT/health..."
            MAX_ATTEMPTS=6
            ATTEMPT=0
            HEALTH_OK=false

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              ATTEMPT=$((ATTEMPT + 1))
              if curl -sf http://localhost:$PORT/health > /dev/null 2>&1; then
                HEALTH_OK=true
                break
              fi
              echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS failed, waiting 5s..."
              sleep 5
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "✅ Deployed $ENV environment to ~/$DEPLOY_DIR (port $PORT)"
            else
              echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
              echo "📋 Recent logs from $LOG_FILE:"
              tail -n 50 $LOG_FILE
              exit 1
            fi
          EOF

      # 7️⃣ Notify Discord on success
      - name: Discord → success
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CHANGES: ${{ steps.diff.outputs.changed_files }}
          ENV: ${{ steps.env.outputs.environment }}
          PORT: ${{ steps.env.outputs.port }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          if [ -z "$CHANGES" ]; then
            CONTENT="🔕 No FastAPI files changed—deploy skipped ($ENV)."
          else
            ESC=$(printf '%s' "$CHANGES" | sed 's/"/\\"/g')
            if [ "$ENV" = "prod" ]; then
              EMOJI="✅"
            else
              EMOJI="🚧"
            fi
            CONTENT="$EMOJI FastAPI **$ENV** deployed (port $PORT):\n\`\`\`\n$ESC\n\`\`\`"
          fi
          curl -s -X POST -H "Content-Type: application/json" \
               -d "{\"content\":\"$CONTENT\"}" \
               "$WEBHOOK"

      # 8️⃣ Notify Discord on failure
      - name: Discord → failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ENV: ${{ steps.env.outputs.environment }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          curl -s -X POST -H "Content-Type: application/json" \
               -d "{\"content\":\"❌ FastAPI **$ENV** deploy failed.\"}" \
               "$WEBHOOK"
