name: Deploy to S3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  deploy-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Create production .env file
        run: |
          echo "# Production .env file" > .env
          echo "NODE_ENV=production" >> .env
          echo "CI=true" >> .env
          echo "FASTAPI_URL=${{ secrets.FASTAPI_URL }}" >> .env
          echo "YETCODE_API_KEY=${{ secrets.YETCODE_API_KEY }}" >> .env

      - name: Decode code signing certificate
        run: echo "${{ secrets.CSC_LINK }}" | base64 --decode > certificate.p12
        
      - name: Package and Upload to S3 (macOS)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: npm run package:publish

  deploy-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from package.json
        id: package-version
        run: |
          $version = node -p "require('./package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Create production .env file
        run: |
          echo "# Production .env file" > .env
          echo "NODE_ENV=production" >> .env
          echo "CI=true" >> .env
          echo "FASTAPI_URL=${{ secrets.FASTAPI_URL }}" >> .env
          echo "YETCODE_API_KEY=${{ secrets.YETCODE_API_KEY }}" >> .env

      - name: Package and Upload to S3 (Windows)
        run: |
          $env:AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          $env:AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          $env:AWS_REGION="us-east-1"
          npm run package:publish

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-mac, deploy-windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Deployment Complete
        run: |
          echo "🎉 Deployment complete for version ${{ steps.package-version.outputs.version }}!"
          echo ""
          echo "📦 Files uploaded to S3:"
          echo "• macOS DMG: https://yeetcode-bucket.s3.us-east-1.amazonaws.com/YeetCode.dmg"
          echo "• macOS ZIP: https://yeetcode-bucket.s3.us-east-1.amazonaws.com/YeetCode-${{ steps.package-version.outputs.version }}-mac-universal.zip"
          echo "• Windows: https://yeetcode-bucket.s3.us-east-1.amazonaws.com/YeetCode.exe"
          echo ""
          echo "📋 Auto-update files:"
          echo "• latest-mac.yml: https://yeetcode-bucket.s3.us-east-1.amazonaws.com/latest-mac.yml"
          echo "• latest.yml: https://yeetcode-bucket.s3.us-east-1.amazonaws.com/latest.yml"
          echo ""
          echo "✅ Users on older versions will auto-update to ${{ steps.package-version.outputs.version }}!"
